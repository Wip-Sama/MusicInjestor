name: CI & Docker Publish

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  quality-and-test:
    name: Lint, Typecheck & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system audio & archive dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libchromaprint-tools \
            7zip \
            ffmpeg \
            ca-certificates \
            curl
          sudo rm -rf /var/lib/apt/lists/*

      - name: Install uv and Python 3.14
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
          enable-cache: ${{ !env.ACT }}

      - name: Sync locked Python dependencies
        run: uv sync --frozen

      - name: Run Ruff linter
        run: uv run ruff check

      - name: Run Ruff format check
        run: uv run ruff format --check

      - name: Run ty static type checker
        run: uv run ty check

      - name: Run unit, architectural, and integration test suite
        run: uv run pytest

  docker-build-publish:
    name: Build & Publish Docker Image (GHCR)
    runs-on: ubuntu-latest
    needs:
      - quality-and-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        if: ${{ !env.ACT }}
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        if: ${{ !env.ACT && github.event_name != 'pull_request' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags & labels)
        id: meta
        if: ${{ !env.ACT }}
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Build and push Docker image to GHCR
        if: ${{ !env.ACT }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and verify Docker image locally (act mode)
        if: ${{ env.ACT }}
        run: |
          docker build -t music-ingest-bot:act-ci -f Dockerfile .
          docker run --rm music-ingest-bot:act-ci uv run pytest -q

