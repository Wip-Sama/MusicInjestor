# ============================================================================
# Production Docker Compose Template — External Mounted Music Folder
# ============================================================================
# Usage:
#   1. Copy `config.example.yaml` -> `config.yaml` (and/or `.env.example` -> `.env`)
#   2. Set `HOST_MUSIC_DIR` in `.env` (or replace `/path/to/external/music` below)
#      with your real external host/NAS music folder path:
#        - Linux / NAS:  HOST_MUSIC_DIR=/mnt/nas/music
#        - Windows/WSL:  HOST_MUSIC_DIR=D:/Music
#   3. Set `MUSIC_BOT_IMAGE=ghcr.io/<github-user>/<repo>:latest` in `.env` to pull from GHCR:
#        - Pull pre-built image from GHCR: `docker compose pull && docker compose up -d`
#        - Or build from local source:     `docker compose up -d --build`
# ============================================================================

services:
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    container_name: music-telegram-bot-api
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:-12345678}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:-0123456789abcdef0123456789abcdef}
      TELEGRAM_LOCAL: 1
      TELEGRAM_HTTP_PORT: 8081
      TELEGRAM_STAT: 1
      TELEGRAM_HTTP_STAT_PORT: 8082
    ports:
      - "${TELEGRAM_LOCAL_API_PORT:-8081}:8081"
      - "8082:8082"
    volumes:
      - ./storage/telegram-bot-api:/var/lib/telegram-bot-api

  music-ingest-bot:
    image: ${MUSIC_BOT_IMAGE:-ghcr.io/wip-sama/musicinjestor:latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: music-ingest-bot
    restart: unless-stopped
    # Set PUID/PGID in .env (e.g. 1000:1000) so files written to your external music folder
    # match your host user/group ownership on Linux or NAS systems.
    user: "${PUID:-0}:${PGID:-0}"
    depends_on:
      - telegram-bot-api
    env_file:
      - path: .env
        required: false
    environment:
      CONFIG_FILE: /app/config.yaml
      TELEGRAM_USE_LOCAL_API: "true"
      TELEGRAM_LOCAL_API_URL: http://telegram-bot-api:8081
      TELEGRAM_LOCAL_API_WORK_DIR: /var/lib/telegram-bot-api
      TELEGRAM_LOCAL_API_HOST_DIR: /var/lib/telegram-bot-api
      STORAGE_SCRATCH_DIR: /app/storage/scratch
      STORAGE_LIBRARY_DIR: /mnt/music/library
      DATABASE_PATH: /app/storage/library.db
      UMASK: ${UMASK:-0022}
      WEB_LISTEN_HOST: ${WEB_LISTEN_HOST:-0.0.0.0}
      WEB_LISTEN_PORT: ${WEB_LISTEN_PORT:-8080}
      WEB_APP_DEV_MODE: ${WEB_APP_DEV_MODE:-false}
      WEB_APP_STATIC_DIR: ${WEB_APP_STATIC_DIR:-/app/webapp/dist}
    ports:
      - "${WEB_LISTEN_PORT:-${OIDC_LISTEN_PORT:-8080}}:${WEB_LISTEN_PORT:-8080}"
    volumes:
      # 1. Shared volume with telegram-bot-api for zero-copy local file access (up to 2GB)
      - ./storage/telegram-bot-api:/var/lib/telegram-bot-api:ro
      # 2. EXTERNAL MUSIC FOLDER (lives outside the container on your host/NAS):
      - ${HOST_MUSIC_DIR:-/path/to/external/music}:/mnt/music/library
      # 3. Persistent bot state (SQLite WAL library.db and temporary archive scratch space)
      - ./storage:/app/storage
      # 4. YAML configuration file (`cp config.example.yaml config.yaml` before starting)
      - ./config.yaml:/app/config.yaml:ro
      # 5. Optional: bind-mount local webapp/dist for instant frontend updates without rebuilding container:
      # - ./webapp/dist:/app/webapp/dist:ro

