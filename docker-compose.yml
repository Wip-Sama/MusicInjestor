services:
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    container_name: music-telegram-bot-api
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:-12345678}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:-0123456789abcdef0123456789abcdef}
      TELEGRAM_LOCAL: 1
      TELEGRAM_HTTP_PORT: 8081
      TELEGRAM_STAT: 1
      TELEGRAM_HTTP_STAT_PORT: 8082
    ports:
      - "${TELEGRAM_LOCAL_API_PORT:-8081}:8081"
      - "8082:8082"
    volumes:
      - ./storage/telegram-bot-api:/var/lib/telegram-bot-api

  music-ingest-bot:
    image: ${MUSIC_BOT_IMAGE:-ghcr.io/wip-sama/musicinjestor:latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: music-ingest-bot
    restart: unless-stopped
    user: "${PUID:-0}:${PGID:-0}"
    depends_on:
      - telegram-bot-api
    env_file:
      - path: .env
        required: false
    environment:
      CONFIG_FILE: ${CONFIG_FILE:-config.yaml}
      TELEGRAM_USE_LOCAL_API: "true"
      TELEGRAM_LOCAL_API_URL: http://telegram-bot-api:8081
      TELEGRAM_LOCAL_API_WORK_DIR: /var/lib/telegram-bot-api
      TELEGRAM_LOCAL_API_HOST_DIR: /var/lib/telegram-bot-api
      STORAGE_SCRATCH_DIR: /app/storage/scratch
      STORAGE_LIBRARY_DIR: /mnt/music/library
      STORAGE_STREAM_CACHE_DIR: /app/storage/cache/streams
      DATABASE_PATH: /app/storage/library.db
      MUSIC_PROVIDER_MIN_ARCHIVAL_QUALITY: ${MUSIC_PROVIDER_MIN_ARCHIVAL_QUALITY:-lossless}
      STREAM_CACHE_TTL_SECONDS: ${STREAM_CACHE_TTL_SECONDS:-3600}
      STREAM_CACHE_MAX_MB: ${STREAM_CACHE_MAX_MB:-256}
      UMASK: ${UMASK:-0022}
      WEB_LISTEN_HOST: ${WEB_LISTEN_HOST:-0.0.0.0}
      WEB_LISTEN_PORT: ${WEB_LISTEN_PORT:-8080}
      WEB_APP_DEV_MODE: ${WEB_APP_DEV_MODE:-false}
      WEB_APP_STATIC_DIR: ${WEB_APP_STATIC_DIR:-/app/webapp/dist}
      DEFAULT_MUSIC_PROVIDER_URL: ${DEFAULT_MUSIC_PROVIDER_URL:-http://music-provider:8000}
      DEFAULT_MUSIC_PROVIDER_TOKEN: ${DEFAULT_MUSIC_PROVIDER_TOKEN:-}
    ports:
      - "${WEB_LISTEN_PORT:-${OIDC_LISTEN_PORT:-8080}}:${WEB_LISTEN_PORT:-8080}"
    volumes:
      # Shared volume with telegram-bot-api for zero-copy local file access (up to 2GB)
      - ./storage/telegram-bot-api:/var/lib/telegram-bot-api:ro
      # External host/NAS music folder mounted into the container (override HOST_MUSIC_DIR in .env)
      - ${HOST_MUSIC_DIR:-./storage/library}:/mnt/music/library
      # Persistent bot state (SQLite WAL library.db and temporary archive extraction scratch)
      - ./storage:/app/storage
      # Optional: bind-mount local webapp/dist for instant frontend updates without rebuilding container:
      # - ./webapp/dist:/app/webapp/dist:ro
      # Uncomment below if using a local config.yaml file on the host:
      # - ./config.yaml:/app/config.yaml:ro

  test:
    image: ${MUSIC_BOT_IMAGE:-ghcr.io/wip-sama/musicinjestor:latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: music-ingest-test
    profiles:
      - test
    environment:
      TELEGRAM_USE_LOCAL_API: "true"
      TELEGRAM_LOCAL_API_URL: http://telegram-bot-api:8081
      TELEGRAM_LOCAL_API_WORK_DIR: /var/lib/telegram-bot-api
      TELEGRAM_LOCAL_API_HOST_DIR: /var/lib/telegram-bot-api
    command: ["uv", "run", "pytest"]

  music-provider:
    build:
      context: ./provider
      dockerfile: Dockerfile
    container_name: music-provider
    restart: unless-stopped
    ports:
      - "${PROVIDER_PORT:-8085}:8000"
    env_file:
      - path: .env
        required: false
      - path: ./provider/.env
        required: false
    environment:
      PROVIDER_HOST: 0.0.0.0
      PROVIDER_PORT: 8000
      PROVIDER_STORAGE_DIR: /data/artifacts
    volumes:
      - ./storage/providers/flac:/data/artifacts
      - ./storage/providers/spotiflac-state:/root/.spotiflac

  music-provider-stream:
    build:
      context: ./provider
      dockerfile: Dockerfile
    container_name: music-provider-stream
    profiles:
      - split-providers
    restart: unless-stopped
    ports:
      - "${PROVIDER_STREAM_PORT:-8086}:8000"
    env_file:
      - path: .env
        required: false
      - path: ./provider/.env
        required: false
    environment:
      PROVIDER_HOST: 0.0.0.0
      PROVIDER_PORT: 8000
      PROVIDER_NAME: YouTube Stream
      PROVIDER_STORAGE_DIR: /data/artifacts
      PROVIDER_DEFAULT_ENGINE: youtube
      PROVIDER_STREAMING_ENABLED: "true"
      PROVIDER_PROVISIONING_ENABLED: "false"
      PROVIDER_USE_CLOUDFLARED_TUNNEL: "false"
    volumes:
      - ./storage/providers/stream:/data/artifacts


