repos:
  # Formatters and linters
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: uv run ruff check --fix
        language: system
        types_or: [python, pyi]
        files: ^(src/|tests/|.*\.py$)
        pass_filenames: false
        always_run: false

      - id: ruff-format
        name: ruff-format
        entry: uv run ruff format
        language: system
        types_or: [python, pyi]
        files: ^(src/|tests/|.*\.py$)
        pass_filenames: false
        always_run: false

  # Type checkers
      - id: ty
        name: ty
        entry: uv run ty check
        language: system
        types: [python]
        pass_filenames: false
        always_run: true

