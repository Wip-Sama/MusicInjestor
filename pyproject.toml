[project]
name = "musicdownloader"
version = "0.1.0"
description = "Automated self-hosted music ingestion system via Local Telegram Bot API"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiogram>=3.31.0",
    "aiosqlite>=0.22.1",
    "httpx>=0.28.1",
    "lyricsgenius>=3.15.0",
    "musicbrainzngs>=0.7.1",
    "mutagen>=1.48.1",
    "pathvalidate>=3.3.1",
    "pyacoustid>=1.3.1",
    "pydantic>=2.13.5",
    "pylast>=7.2.0",
    "sqlalchemy>=2.1.4",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pre-commit>=4.6.2",
    "pylint>=4.1.2",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
    "ty>=0.0.86",
]

[tool.ruff]
line-length = 110
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ty.terminal]
error-on-warning = true

[tool.ty.rules]
missing-type-argument = "error"
possibly-unresolved-reference = "warn"

[tool.pylint]
ignore = [".venv", "venv", "check.py", "lint.py"]
disable = ["redefined-outer-name"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-v --cov=src --cov-report=term-missing --cov-report=html"
markers = [
    "integration: integration tests touching SQLite or filesystem",
    "docker: smoke tests requiring the WSL Docker telegram-bot-api container",
]

